services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bdf_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    networks:
      - bdf_net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | (exec 3<> /dev/tcp/localhost/2181; cat >&3; cat <&3; exec 3<&-) | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bdf_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_HOST_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Два листенера: один для контейнеров (kafka:29092), один для хоста (localhost:9092)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bdf_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: bdf_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - bdf_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: bdf_flink_jm
    ports:
      - "${FLINK_JOBMANAGER_PORT}:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.flamegraph.enabled: true
    volumes:
      - ./jars:/opt/flink/lib-extra:ro
      - ./flink-job:/opt/flink/job:ro
    networks:
      - bdf_net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: bdf_flink_tm
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink-job:/opt/flink/job:ro
    networks:
      - bdf_net
    depends_on:
      - flink-jobmanager

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: bdf_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      DATA_DIR: /data
      DELAY_MS: ${PRODUCER_DELAY_MS}
    volumes:
      - "./исходные данные:/data:ro"
    networks:
      - bdf_net
    profiles:
      - producer

volumes:
  pg_data:

networks:
  bdf_net:
    driver: bridge
